<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f9cf5"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circ"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <!-- всё внутри круга; углы прозрачные -> отображается круглым везде -->
  <g clip-path="url(#circ)">
    <circle cx="128" cy="128" r="128" fill="url(#g)"/>
    <circle cx="128" cy="128" r="128" fill="url(#gloss)"/>
    <text x="50%" y="53%" font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="800"
          fill="#ffffff" fill-opacity="0.92" text-anchor="middle" dominant-baseline="middle">P5</text>
  </g>
</svg>
