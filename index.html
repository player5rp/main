<style>

:root{
  --card-bg:rgba(28,28,28,0.40);   
  --card-border:rgba(39,39,39,0.20); 
  --text:#ffffff;
  --muted:#9a9a9a;
  --muted-2:#6f6f6f;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Chillax', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:#0a0a0a;                
  color:var(--text);
  min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:28px 16px; overflow:hidden;
  -webkit-user-select:none; user-select:none;
}


img{-webkit-user-drag:none; -khtml-user-drag:none; user-select:none; -webkit-user-select:none; pointer-events:none;}


html.cc, html.cc *{cursor:none !important;}

/* night background canvas */
#night{position:fixed; inset:0; z-index:-1; pointer-events:none;}

/* ---------- Enter overlay ---------- */
#enter{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; cursor:pointer; text-align:center; padding:20px;
  background:rgba(10,10,10,0.88); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:opacity .6s ease, visibility .6s;}
#enter.hide{opacity:0; visibility:hidden; pointer-events:none;}
#enter .et{font-size:clamp(26px,6vw,40px); font-weight:600; letter-spacing:.5px;}
#enter .es{color:var(--muted); font-size:13px; letter-spacing:3px; text-transform:uppercase; animation:blk 1.6s ease-in-out infinite;}
@keyframes blk{50%{opacity:.4;}}

/* ---------- Wrapper (parallax) ---------- */
.stage{width:100%; display:flex; justify-content:center; perspective:900px;}
.wrap{width:100%; max-width:660px; display:flex; flex-direction:column; gap:14px;
  transform-style:preserve-3d; will-change:transform; opacity:0; transition:opacity .5s ease;}
.wrap.show{opacity:1;}

/* pop entrance (animation:"pop") */
@keyframes pop{0%{opacity:0; transform:scale(.8);}60%{opacity:1; transform:scale(1.03);}100%{opacity:1; transform:scale(1);}}
.wrap.show .card{animation:pop .5s cubic-bezier(.2,.8,.3,1.2) both;}
.wrap.show .player{animation:pop .5s cubic-bezier(.2,.8,.3,1.2) .08s both;}

.glass{background:var(--card-bg); border:2px solid var(--card-border);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);}
.card{border-radius:10px; padding:26px 26px 22px;}

/* header */
.header{display:flex; align-items:center; gap:22px;}
.avatar{width:112px; height:112px; border-radius:50%; object-fit:cover; flex:0 0 auto;}
.head-col{min-width:0;}
.name-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.username{font-weight:600; font-size:34px; line-height:1.1; color:#fff;}
.badge-row{display:inline-flex; align-items:center; gap:6px;}
.badge{color:#fff; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
  position:relative; border-radius:9px;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.09);
  transition:transform .15s ease, background .15s;}
.badge:hover{transform:translateY(-2px) scale(1.08); background:rgba(255,255,255,0.13);}
.badge svg{width:19px; height:19px; filter:drop-shadow(0 0 2.5px rgba(255,255,255,0.85));}
.badge.claude{color:#d97757;}
.badge.claude svg{filter:drop-shadow(0 0 4px rgba(217,119,87,0.9));}
.badge .tip{position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(4px);
  background:#1a1a1a; border:1px solid #2c2c2c; color:#fff; padding:4px 8px; border-radius:7px;
  font-size:11px; font-weight:500; white-space:nowrap; opacity:0; pointer-events:none; transition:.16s;
  filter:none; box-shadow:0 6px 16px rgba(0,0,0,0.5); z-index:5;}
.badge:hover .tip{opacity:1; transform:translateX(-50%) translateY(0);}
.tagline{margin-top:8px; font-size:16px; color:#e6e6e6; min-height:20px;}
.tagline .cur{display:inline-block; width:2px; height:1em; background:#fff; margin-left:1px; vertical-align:-2px; animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* blocks */
.block{border-radius:22px; padding:14px 18px; margin-top:16px;
  background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.05);}
.presence{display:flex; align-items:center; gap:14px;}
.dc-ava-wrap{position:relative; flex:0 0 auto;}
.dc-ava{width:56px; height:56px; border-radius:50%; object-fit:cover; background:#5865f2;}
.dc-status{position:absolute; right:-2px; bottom:-2px; width:18px; height:18px; border-radius:50%; background:#0a0a0a; padding:3px;}
.dc-status img{width:100%; height:100%; display:block;}
.dc-name{font-weight:600; font-size:17px;}
.dc-sub{font-size:13px; color:var(--muted); font-style:italic; margin-top:2px;}

/* clock */
.clock-block{display:flex; align-items:center; gap:18px; position:relative;}
.analog{width:74px; height:74px; flex:0 0 auto;}
.clock-info{flex:1; min-width:0;}
.digital{font-size:24px; font-weight:600; letter-spacing:.5px; font-variant-numeric:tabular-nums; line-height:1.2;}
.date-line{font-size:15px; font-weight:600; margin-top:2px;}
.your-time{font-size:13px; color:var(--muted-2); margin-top:3px;}
.tz-btn{position:absolute; top:10px; right:12px; display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); background:transparent; border:none;}
.tz-btn svg{width:13px; height:13px;}

/* social */
.socials{display:flex; align-items:center; gap:20px; justify-content:center; margin-top:20px;}
.socials a{color:#fff; width:24px; height:24px; display:inline-flex; position:relative;
  filter:drop-shadow(0 0 5px rgba(158,158,255,0.85)); transition:transform .16s ease, filter .16s;}
.socials a:hover{transform:translateY(-3px) scale(1.12); filter:drop-shadow(0 0 10px rgba(158,158,255,1));}
.socials a svg{width:100%; height:100%;}
.socials a .tip{position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
  background:#1a1a1a; border:1px solid #2c2c2c; color:#fff; padding:4px 8px; border-radius:7px;
  font-size:11px; font-weight:500; white-space:nowrap; opacity:0; pointer-events:none; transition:.16s;
  filter:none; box-shadow:0 6px 16px rgba(0,0,0,0.5);}
.socials a:hover .tip{opacity:1;}

/* meta */
.meta-row{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px; font-size:15px; color:#ededed;}
.meta-row .item{display:inline-flex; align-items:center; gap:7px;}
.meta-row .item svg{width:17px; height:17px; opacity:.9;}
.meta-row .sep{width:1px; height:16px; background:rgba(255,255,255,0.2);}

/* player */
.player{border-radius:10px; padding:15px; display:flex; align-items:center; gap:16px;}
.cover{width:60px; height:60px; object-fit:cover; flex:0 0 auto; border-radius:4px;}
.p-mid{flex:1; min-width:0;}
.p-title{font-weight:600; font-size:15px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.p-progress{display:flex; align-items:center; gap:10px; margin-top:8px;}
.p-time{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:28px;}
.p-time.end{text-align:right;}
.bar{flex:1; height:5px; border-radius:999px; background:rgba(255,255,255,0.15); position:relative; cursor:pointer;}
.bar .fill{position:absolute; inset:0 auto 0 0; width:0%; background:#fff; border-radius:999px;}
.bar .knob{position:absolute; top:50%; left:0%; width:11px; height:11px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 0 6px rgba(255,255,255,0.6); opacity:0; transition:opacity .15s;}
.bar:hover .knob{opacity:1;}
.p-ctrl{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.p-ctrl button{background:transparent; border:none; color:#fff; cursor:pointer; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; transition:background .15s, transform .15s;}
.p-ctrl button:hover{background:rgba(255,255,255,0.1); transform:scale(1.08);}
.p-ctrl button svg{width:24px; height:24px;}
.p-ctrl .mid svg{width:28px; height:28px;}

.foot{text-align:center; font-size:11px; color:var(--muted-2); margin-top:2px;}

/* ---------- телефоны ---------- */
@media(max-width:560px){
  body{padding:16px 12px;}
  .card{padding:20px 16px 16px; border-radius:14px;}
  .header{gap:14px;}
  .avatar{width:76px; height:76px;}
  .username{font-size:25px;}
  .badge{width:27px; height:27px;} .badge svg{width:17px; height:17px;}
  .tagline{font-size:14px;}
  .block{padding:12px 14px; border-radius:16px;}
  .dc-ava{width:48px; height:48px;}
  .analog{width:62px; height:62px;}
  .digital{font-size:21px;} .date-line{font-size:13px;}
  .socials{gap:16px; margin-top:16px;} .socials a{width:22px; height:22px;}
  .player{gap:12px; padding:12px; flex-wrap:wrap;}
  .p-mid{order:3; flex-basis:100%; margin-top:4px;}
  .cover{width:52px; height:52px;}
  .glass{backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
}
@media(hover:none){ .glass{backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);} }
</style>

  ticks.innerHTML+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${i%3===0?'#555':'#2e2e2e'}" stroke-width="${i%3===0?'1.6':'1'}" stroke-linecap="round"/>`;}

(function(){const el=$('typed'), lines=CONFIG.taglines; let li=0,ci=0,del=false;
  function tick(){const line=lines[li];
    if(!del){el.textContent=line.slice(0,++ci); if(ci===line.length){del=true; return setTimeout(tick,1600);}}
    else{el.textContent=line.slice(0,--ci); if(ci===0){del=false; li=(li+1)%lines.length;}}

/* ---------- clock ---------- */
function tzParts(tz){try{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return o;}catch(e){return null;}}
function tzName(tz){try{return new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value;}catch(e){return '';}}
function setHand(id,deg,len){const r=(deg-90)*Math.PI/180; $(id).setAttribute('x2',(35+Math.cos(r)*len).toFixed(2)); $(id).setAttribute('y2',(35+Math.sin(r)*len).toFixed(2));}
function updateClock(){const d=new Date(), o=tzParts(CONFIG.timezone); let hh,mm,ss;
  if(o){hh=+o.hour%24;mm=+o.minute;ss=+o.second; $('digital').textContent=`${String(hh).padStart(2,'0')}:${o.minute}:${o.second}`; $('date-line').textContent=`${o.weekday}, ${o.month} ${o.day} · ${tzName(CONFIG.timezone)}`;}
  else{hh=d.getHours();mm=d.getMinutes();ss=d.getSeconds(); $('digital').textContent=d.toLocaleTimeString(); $('date-line').textContent=d.toDateString();}
  setHand('h-sec',ss*6,25); setHand('h-min',mm*6+ss*0.1,23); setHand('h-hour',(hh%12)*30+mm*0.5,16);
  const off=-d.getTimezoneOffset()/60; $('your-time').textContent=`Your time: ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} (${off>=0?'+':''}${off}h)`;}
updateClock(); setInterval(updateClock,1000);

(function(){
  const el=$('views');
  function animateTo(v){ v=Math.max(0,Math.floor(v));
    const from=Math.max(0,v-1500), start=performance.now(), dur=1400;
    (function step(t){const p=Math.min(1,(t-start)/dur);
      el.textContent=Math.floor(from+(v-from)*(1-Math.pow(1-p,3))).toLocaleString('en-US');
      if(p<1)requestAnimationFrame(step);})(start);
  }
  const ns=(location.hostname||'local').replace(/[^a-z0-9]/gi,'-').toLowerCase()||'local';
  fetch(`https://abacus.jasoncameron.dev/hit/${ns}-player5rp/views`)
    .then(r=>r.json()).then(d=>animateTo((d&&typeof d.value==='number')?d.value:CONFIG.profileViews))
    .catch(()=>animateTo(CONFIG.profileViews));
})();

/* ---------- night background (background_effects:"night") ---------- */
(function(){
  const cv=$('night'), ctx=cv.getContext('2d'); let W,H,stars=[],shoot=null,last=0,lastDraw=0;
  const MOB=matchMedia('(hover:none), (max-width:560px)').matches;
  const DENS=MOB?22000:13000, THR=MOB?66:45;   // на телефоне меньше звёзд и реже перерисовка
  function resize(){W=cv.width=innerWidth; H=cv.height=innerHeight;
    stars=[]; const n=Math.round(W*H/DENS);
    for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+0.3,tw:Math.random()*Math.PI*2,sp:0.6+Math.random()*1.4});}
  resize(); addEventListener('resize',resize);
  function loop(t){
    requestAnimationFrame(loop);
    if(t-lastDraw<THR) return; lastDraw=t;
    ctx.clearRect(0,0,W,H);
    for(const s of stars){const a=0.35+0.45*(0.5+0.5*Math.sin(s.tw+t*0.001*s.sp));
      ctx.globalAlpha=a; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();}
    ctx.globalAlpha=1;
    // редкая падающая звезда
    if(!shoot && t-last>4200 && Math.random()<0.03){last=t; shoot={x:Math.random()*W*0.7,y:Math.random()*H*0.4,len:0,vx:6+Math.random()*4,vy:2+Math.random()*2,life:1};}
    if(shoot){const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*8,shoot.y-shoot.vy*8);
      g.addColorStop(0,'rgba(255,255,255,'+shoot.life+')'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(shoot.x-shoot.vx*8,shoot.y-shoot.vy*8); ctx.stroke();
      shoot.x+=shoot.vx; shoot.y+=shoot.vy; shoot.life-=0.012; if(shoot.life<=0||shoot.x>W||shoot.y>H)shoot=null;}
  }
  requestAnimationFrame(loop);
})();

/* ---------- parallax (parallax_animation:true) ---------- */
(function(){
  if(matchMedia('(pointer:coarse)').matches) return;  
  const w=$('wrap'); let tx=0,ty=0,cx=0,cy=0, hot=false;
  document.addEventListener('mouseover',e=>{ if(e.target.closest('a,button,.badge')) hot=true; });
  document.addEventListener('mouseout',e=>{ const to=e.relatedTarget;
    if(!to || !(to.closest&&to.closest('a,button,.badge'))) hot=false; });
  addEventListener('mousemove',e=>{ if(hot) return;
    tx=(e.clientX/innerWidth-0.5)*2; ty=(e.clientY/innerHeight-0.5)*2; },{passive:true});
  (function loop(){cx+=(tx-cx)*0.07; cy+=(ty-cy)*0.07;
    w.style.transform=`rotateY(${(cx*5).toFixed(2)}deg) rotateX(${(-cy*5).toFixed(2)}deg)`;
    requestAnimationFrame(loop);})();
})();

/* ---------- music player ---------- */
const audio=$('audio'); let realAudio=false, simTime=0, simTimer=null, playing=false;
$('p-title').textContent=CONFIG.music.title; $('cover').src=CONFIG.music.cover; audio.src=CONFIG.music.src; audio.volume=0.6;
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function dur(){return realAudio&&audio.duration?audio.duration:CONFIG.music.fallbackDuration;}
function curT(){return realAudio?audio.currentTime:simTime;}
function render(){const D=dur(),C=curT(),p=D?C/D*100:0; $('fill').style.width=p+'%'; $('knob').style.left=p+'%'; $('cur-time').textContent=fmt(C); $('dur-time').textContent=fmt(D);}
function stopSim(){ if(simTimer){clearInterval(simTimer); simTimer=null;} }
function startSim(){ if(simTimer)return; simTimer=setInterval(()=>{simTime+=0.25; if(simTime>=dur())simTime=0; render();},250); }
audio.addEventListener('loadedmetadata',()=>{ realAudio=true; stopSim(); render(); });
audio.addEventListener('playing',()=>{ realAudio=true; stopSim(); });   // реальное аудио пошло — глушим симуляцию
audio.addEventListener('timeupdate',render);
function setPlaying(v){
  playing=v; $('ic-play').style.display=v?'none':'block'; $('ic-pause').style.display=v?'block':'none';
  if(v){
    audio.play().then(()=>{ realAudio=true; stopSim(); }).catch(()=>{ startSim(); }); // реальный трек ИЛИ (если нет) симуляция — но не оба
  }else{
    audio.pause(); stopSim();
  }
}
$('play-btn').onclick=()=>setPlaying(!playing);
$('prev-btn').onclick=()=>{if(realAudio)audio.currentTime=0; else simTime=0; render();};
$('next-btn').onclick=()=>{if(realAudio)audio.currentTime=Math.min(dur(),audio.currentTime+15); else simTime=Math.min(dur(),simTime+15); render();};
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); if(realAudio&&audio.duration)audio.currentTime=p*audio.duration; else simTime=p*dur(); render();};
render();

(function(){
  if(matchMedia('(pointer:coarse)').matches) return;
  document.documentElement.classList.add('cc');   
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;z-index:9999;pointer-events:none;';
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); let W,H;
  function resize(){W=cv.width=innerWidth; H=cv.height=innerHeight;}
  resize(); addEventListener('resize',resize);
  let mx=innerWidth/2, my=innerHeight/2, px=mx, py=my, parts=[], vis=false;
  addEventListener('mousemove',e=>{mx=e.clientX; my=e.clientY; vis=true;},{passive:true});
  addEventListener('mouseout',e=>{ if(!e.relatedTarget) vis=false; });
  function loop(){
    requestAnimationFrame(loop);
    ctx.clearRect(0,0,W,H);
    const d=Math.hypot(mx-px,my-py);
    if(vis && d>2){const n=Math.min(2,1+Math.floor(d/16));
      for(let i=0;i<n;i++)parts.push({x:px+(mx-px)*Math.random(),y:py+(my-py)*Math.random(),r:Math.random()*1.3+0.7,life:1,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4});}
    px=mx; py=my;
    if(parts.length>70)parts.splice(0,parts.length-70);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.05;
      if(p.life<=0){parts.splice(i,1); continue;}
      ctx.globalAlpha=p.life*0.7; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,6.283); ctx.fill();}
    if(vis){ ctx.globalAlpha=0.30; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mx,my,7,0,6.283); ctx.fill();
      ctx.globalAlpha=1; ctx.beginPath(); ctx.arc(mx,my,3.3,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(loop);
})();

const enter=$('enter'), wrap=$('wrap'); let entered=false;
function doEnter(){
  if(entered) return; entered=true;             
  enter.classList.add('hide'); wrap.classList.add('show'); setPlaying(true);
  setTimeout(()=>enter.style.display='none',700);
  enter.removeEventListener('click',doEnter); window.removeEventListener('keydown',doEnter);
}
enter.addEventListener('click',doEnter); window.addEventListener('keydown',doEnter);
